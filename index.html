<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Practice App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="background">

   <h1>Ostinato</h1>
   <div class="content">
        <h2 id = "scaleLabel">C Major</h2>
        <div class="overlay" id = "midi-overlay">
            <div class="overlay-content" id="midi-overlay-content">
                <h2>Connect Your Piano</h2>
                <p>Connect your digital piano to this device using a MIDI cable.</p>
                <button id="connect-midi-button">Connect MIDI</button>
                <span id="midiStatus"></span>
            </div>
        </div>
        <div class="overlay hidden" id = "completion-overlay">
            <div class="overlay-content" id = "completion-overlay-content">
                <h2>Good Job!</h2>
            </div>
        </div>
        <div class="keyboard">
                <button class="white-key" data-note= "C4" data-midi-note="60">
                    <span>C</span>
                </button>
                <button class="black-key c-sharp-4" data-note="C#4" data-midi-note="61">
                    <span>C#</span>
                </button>
                <button class="white-key" data-note="D4" data-midi-note="62">
                    <span>D</span>
                </button>
                <button class="black-key d-sharp-4" data-note="D#4" data-midi-note="63">
                    <span>D#</span>
                </button>
                <button class="white-key" data-note="E4" data-midi-note="64">
                    <span>E</span>
                </button>
                <button class="white-key" data-note="F4" data-midi-note="65">
                    <span>F</span>
                </button>
                <button class="black-key f-sharp-4" data-note="F#4" data-midi-note="66">
                    <span>F#</span>
                </button>
                <button class="white-key" data-note="G4" data-midi-note="67">
                    <span>G</span>
                </button>
                <button class="black-key g-sharp-4" data-note="G#4" data-midi-note="68">
                    <span>G#</span>
                </button>
                <button class="white-key" data-note="A4" data-midi-note="69">
                    <span>A</span>
                </button>
                <button class="black-key a-sharp-4" data-note="A#4" data-midi-note="70">
                    <span>A#</span>
                </button>
                <button class="white-key" data-note="B4" data-midi-note="71">
                    <span>B</span>
                </button>
                <button class="white-key" data-note="C5" data-midi-note="72">
                    <span>C</span>
                </button>
        </div>
        <div id= "buttonContainer">
            <button class = "mode-button active" data-mode = "free-play">Free Play</button>
            <button class = "mode-button" data-mode = "scale">Scales Practice</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
